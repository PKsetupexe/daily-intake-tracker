name: macOS package

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Build and test
        run: npm test
      - name: Prepare desktop package
        run: npm run desktop:prepare
      - name: Build macOS disk image
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --projectDir installer/electron-app --mac dmg --${{ matrix.arch }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: daily-intake-macos-${{ matrix.arch }}
          path: installer/electron-output-v3.6.0/*.dmg
          if-no-files-found: error
      - name: Smoke test macOS desktop lifecycle
        run: npx electron scripts/smoke-macos.mjs
